<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Köyden Şehre — Üretici Başvurusu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7f2;
      color: #1f2a1d;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(31, 42, 29, .08);
      max-width: 420px;
      width: 100%;
      padding: 32px 28px;
      text-align: center;
    }
    .logo { font-size: 40px; margin-bottom: 12px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 15px; color: #4c5a49; line-height: 1.5; margin-bottom: 20px; }
    .code {
      display: inline-block;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 22px;
      letter-spacing: 2px;
      background: #eaf2e6;
      color: #2e5928;
      border: 1px dashed #7aa871;
      border-radius: 10px;
      padding: 12px 20px;
      margin-bottom: 20px;
      user-select: all;
    }
    .btn {
      display: block;
      width: 100%;
      background: #3d7434;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn.secondary { background: #eaf2e6; color: #2e5928; }
    .hint { font-size: 13px; color: #7c8879; margin-top: 12px; }
    .notice {
      font-size: 13px;
      line-height: 1.5;
      color: #7a4a12;
      background: #fdf3e3;
      border: 1px solid #f0d8ae;
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌾</div>
    <h1>Köyden Şehre Üretici Ağı</h1>
    <p>Üretici başvurusu için davet kodunuz:</p>
    <div class="code" id="code">—</div>
    <button class="btn" id="openApp">Uygulamada Aç</button>
    <button class="btn secondary" id="copyCode">Kodu Kopyala</button>
    <p class="notice" id="notice" hidden></p>
    <p class="hint">Uygulama açılmazsa Köyden Şehre uygulamasını yükleyin ve
      başvuru ekranında davet kodunu elle girin.</p>
  </div>
  <script src="/open-app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const invite = (params.get('invite') || '').toUpperCase();
    const codeEl = document.getElementById('code');
    codeEl.textContent = invite || 'Kod bulunamadı';

    initOpenApp({
      path: 'apply',
      query: invite ? '?invite=' + encodeURIComponent(invite) : '',
      button: document.getElementById('openApp'),
      notice: document.getElementById('notice'),
      autoOpen: !!invite,
      desktopMessage:
        'Uygulamada açma yalnızca telefonda çalışır. Davet kodunu kopyalayıp ' +
        'telefonunuzdaki Köyden Şehre uygulamasının başvuru ekranına elle girin.',
      notInstalledMessage:
        'Uygulama bulunamadı. Köyden Şehre uygulamasını yükleyip davet kodunu ' +
        'başvuru ekranında elle girebilirsiniz.',
    });

    document.getElementById('copyCode').addEventListener('click', async (e) => {
      if (!invite) return;
      try {
        await navigator.clipboard.writeText(invite);
        e.target.textContent = 'Kopyalandı ✓';
        setTimeout(() => { e.target.textContent = 'Kodu Kopyala'; }, 2000);
      } catch (_) {}
    });
  </script>
</body>
</html>
