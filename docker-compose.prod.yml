version: "3.9"

name: koydensehire

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koydensehire}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-koydensehire}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: koydensehire-api:latest
    env_file:
      - .env
    ports:
      # Yalnızca localhost'a bağlı: dış dünyaya erişim cloudflared tünelinden
      # geçer (tünel bu servise container ağı üzerinden, servis adıyla
      # erişir — host portu tünel yönlendirmesi için gerekmez, yalnızca
      # sunucudan debug amaçlı curl için). 18080 kullanılıyor çünkü VDS'te
      # aynı sunucuyu paylaşan Agent-Tale stack'i host 8080'i zaten kullanıyor.
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # Aynı gerekçe: dış trafik cloudflared tünelinden geçer. 18081
      # kullanılıyor çünkü VDS'te Agent-Tale'in edge container'ı host 80/443'ü
      # zaten kullanıyor.
      - "127.0.0.1:18081:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./flutter-mobile/build/web:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Agent-Tale'deki gibi ücretsiz CLI/config-dosyası tabanlı tunnel
    # (dashboard/Zero Trust token akışı değil). ~/.cloudflared altında
    # `cloudflared tunnel login` + `create` + `route dns` ile üretilen
    # config.yml ve credentials JSON'u salt-okunur mount edilir.
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ${CLOUDFLARED_CONFIG_DIR:-./cloudflared}:/etc/cloudflared:ro
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
