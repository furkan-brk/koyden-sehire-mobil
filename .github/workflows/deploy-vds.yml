name: Deploy VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------
  # Backend -> VDS via SSH (docker compose)
  # -------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to VDS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            set -euo pipefail
            
            # The project path on the VDS
            cd /opt/koydensehire

            # Pull latest changes from git
            git pull origin main

            # Build and run the container stack
            docker compose -f docker-compose.prod.yml build --no-cache api
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            sleep 5
            # Basic health check to ensure API is up (adjust endpoint as needed)
            curl -sf http://localhost:8080/api/v1/health || exit 1
            echo "Backend deploy OK"

  # -------------------------------------------------------
  # Frontend -> VDS (Flutter Web build + SCP)
  # -------------------------------------------------------
  deploy-frontend:
    name: Build Flutter Web & Deploy to VDS
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: flutter-mobile
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: flutter-mobile
        # VAPID_KEY: Firebase Console → Project Settings → Cloud Messaging →
        # Web configuration → Web Push certificates. Repo secret olarak
        # tanımlanmazsa web push token kaydı sessizce başarısız olur (mobil
        # FCM etkilenmez).
        run: |
          flutter build web --release \
            --dart-define=BASE_URL=/api/v1 \
            --dart-define=VAPID_KEY=${{ secrets.VAPID_KEY }}

      - name: Deploy to VDS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: flutter-mobile/build/web/*
          target: /opt/koydensehire/flutter-mobile/build/web/
          strip_components: 2
