name: koyden_sehire
description: Köyden Şehre - üreticilerle alıcıları doğrudan buluşturan platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Routing
  go_router: ^14.0.0

  # State management
  get: ^4.6.6

  # Charts (admin dashboard)
  fl_chart: ^0.69.0

  # HTTP
  dio: ^5.4.0

  # Storage
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Media
  image_picker: ^1.0.7
  video_compress: ^3.1.4
  cached_network_image: ^3.3.1

  # Web plugins
  flutter_web_plugins:
    sdk: flutter

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.4

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.2.5
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.3

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  share_plus: ^10.1.4

  # Photo viewer (fullscreen zoom)
  photo_view: ^0.14.0

  # QR code generation for invitation sharing
  qr_flutter: ^4.1.0

  cupertino_icons: ^1.0.6
  flutter_map_cancellable_tile_provider: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
